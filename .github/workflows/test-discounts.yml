name: Tests Discounts Service

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'  # Must be >= 3.10: datadog/test-visibility-github-action pins coverage>=7.11 which requires Python 3.10+
          cache: 'pip'
          cache-dependency-path: 'services/discounts/requirements.txt'

      # ========================================================
      # Datadog Test Optimization configuration
      # ========================================================
      - name: Configure Datadog Test Optimization
        uses: datadog/test-visibility-github-action@v2
        with:
          languages: python
          api_key: ${{ secrets.DD_API_KEY }}
          site: datadoghq.com
          service: storedog-discounts

      - name: Install dependencies
        working-directory: ./services/discounts
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      # ========================================================
      # Run tests and generate coverage report
      # ========================================================
      - name: Run tests with coverage
        working-directory: ./services/discounts
        run: |
          cat > .coveragerc <<'COVEOF'
          [run]
          omit = tests/*
          COVEOF
          python -m pytest tests/ -v --cov=. --cov-report=xml:coverage.xml

      # ========================================================
      # Upload code coverage to Datadog
      # ========================================================
      - name: Upload coverage to Datadog
        uses: DataDog/coverage-upload-github-action@v1
        with:
          api_key: ${{ secrets.DD_API_KEY }}
          site: datadoghq.com
          files: ./services/discounts/coverage.xml
